spring.application.name=auth-api
server.port=8081

spring.datasource.url=${AUTH_POSTGRES_URL}
spring.datasource.username=${AUTH_POSTGRES_USER}
spring.datasource.password=${AUTH_POSTGRES_PASSWORD}

app.jwt.private-key-location=${AUTH_JWT_PRIVATE_KEY_LOCATION}
app.jwt.public-key-location=${AUTH_JWT_PUBLIC_KEY_LOCATION}

app.jwt.issuer=${AUTH_JWT_ISSUER}
app.jwt.audience=${AUTH_JWT_AUDIENCE}
app.jwt.access-token-ttl=${AUTH_JWT_ACCESS_TOKEN_TTL}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
