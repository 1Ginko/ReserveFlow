spring.application.name=reserve-api

spring.datasource.url=${RESERVE_POSTGRES_URL}
spring.datasource.username=${RESERVE_POSTGRES_USER}
spring.datasource.password=${RESERVE_POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.reservation-expiration.enabled=true
app.reservation-expiration.fixed-delay-ms=30000
app.reservation-expiration.batch-size=100
