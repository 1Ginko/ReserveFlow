services:
  reserve-postgres:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: ${RESERVE_POSTGRES_DB}
      POSTGRES_USER: ${RESERVE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${RESERVE_POSTGRES_PASSWORD}

    ports:
      - "${RESERVE_POSTGRES_HOST_PORT}:5432"

    volumes:
      - reserve_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${RESERVE_POSTGRES_USER} -d ${RESERVE_POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-postgres:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: ${AUTH_POSTGRES_DB}
      POSTGRES_USER: ${AUTH_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD}

    ports:
      - "${AUTH_POSTGRES_HOST_PORT}:5432"

    volumes:
      - auth_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${AUTH_POSTGRES_USER} -d ${AUTH_POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  reserve-api:
    build:
      context: ./reserve-api

    environment:
      SERVER_PORT: "8080"
      RESERVE_POSTGRES_URL: jdbc:postgresql://reserve-postgres:5432/${RESERVE_POSTGRES_DB}
      RESERVE_POSTGRES_USER: ${RESERVE_POSTGRES_USER}
      RESERVE_POSTGRES_PASSWORD: ${RESERVE_POSTGRES_PASSWORD}

    ports:
      - "8080:8080"

    depends_on:
      reserve-postgres:
        condition: service_healthy


  auth-api:
    build:
      context: ./auth-api

    environment:
      SERVER_PORT: "8081"
      AUTH_POSTGRES_URL: jdbc:postgresql://auth-postgres:5432/${AUTH_POSTGRES_DB}
      AUTH_POSTGRES_USER: ${AUTH_POSTGRES_USER}
      AUTH_POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD}

    ports:
      - "8081:8081"

    depends_on:
      auth-postgres:
        condition: service_healthy

volumes:
  reserve_postgres_data:
    # Reuse the existing reserve database volume.
    name: "${COMPOSE_PROJECT_NAME}_postgres_data"
  auth_postgres_data:



