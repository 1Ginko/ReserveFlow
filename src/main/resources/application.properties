spring.application.name=reserve-flow

spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5434/reserve_flow_db}
spring.datasource.username=${POSTGRES_USER:reserve_flow_app}
spring.datasource.password=${POSTGRES_PASSWORD:reserve_flow_password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.reservation-expiration.enabled=true
app.reservation-expiration.fixed-delay-ms=30000
app.reservation-expiration.batch-size=100